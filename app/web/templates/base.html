<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Voice Log{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('search.index') }}">Voice Log</a>
    <nav>
      <a href="{{ url_for('search.index') }}">Search</a>
      <a href="{{ url_for('browse.days') }}">Days</a>
      <a href="{{ url_for('flags.index') }}">Flags</a>
      <a href="{{ url_for('auth.logout') }}">Logout</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='player.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
